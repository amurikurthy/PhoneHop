name: Release

# Push a tag like v0.3.0 to build a signed APK and publish it as a GitHub release.
# The app's updater installs whatever the latest release contains.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "ANDROID_KEYSTORE_B64 secret is missing"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Test and build
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "${VERSION%%-*}"
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          ./gradlew testDebugUnitTest assembleRelease -PversionName="$VERSION" -PversionCode="$CODE"

      - name: Prepare assets
        run: |
          cp app/build/outputs/apk/release/app-release.apk PhoneHop-${GITHUB_REF_NAME}.apk
          sha256sum PhoneHop-${GITHUB_REF_NAME}.apk > PhoneHop-${GITHUB_REF_NAME}.apk.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "PhoneHop-${GITHUB_REF_NAME}.apk" "PhoneHop-${GITHUB_REF_NAME}.apk.sha256" \
            --title "$GITHUB_REF_NAME" --generate-notes
