name: Release

# Build a signed APK and publish it as a GitHub release. The app's updater installs
# whatever the latest release contains. Two ways to start it:
#   - push a tag like v0.3.0, or
#   - Actions -> Release -> Run workflow, and enter a version like 0.3.0 (the tag is created for you).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the leading v, e.g. 0.3.0'
        required: true
        type: string

permissions:
  contents: write

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "ANDROID_KEYSTORE_B64 secret is missing"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Test and build
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION="${TAG#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]] || { echo "Bad version: $VERSION"; exit 1; }
          IFS=. read -r MAJOR MINOR PATCH <<< "${VERSION%%-*}"
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          ./gradlew testDebugUnitTest assembleRelease -PversionName="$VERSION" -PversionCode="$CODE"

      - name: Prepare assets
        run: |
          cp app/build/outputs/apk/release/app-release.apk "PhoneHop-${TAG}.apk"
          sha256sum "PhoneHop-${TAG}.apk" > "PhoneHop-${TAG}.apk.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            "PhoneHop-${TAG}.apk" "PhoneHop-${TAG}.apk.sha256" \
            --target "$GITHUB_SHA" --title "$TAG" --generate-notes
