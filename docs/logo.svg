<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0B0D"/>
      <stop offset="1" stop-color="#1B1D22"/>
    </linearGradient>
    <radialGradient id="glow" cx="78" cy="22" r="70" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8F99A6" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#8F99A6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="20" cy="95" r="55" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5E6672" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#5E6672" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hop" x1="22" y1="56" x2="86" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5E6672"/>
      <stop offset="1" stop-color="#D5D9DF"/>
    </linearGradient>
    <linearGradient id="wifi" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#8F99A6"/>
      <stop offset="1" stop-color="#D5D9DF"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1C21"/>
      <stop offset="1" stop-color="#0E0F12"/>
    </linearGradient>
  </defs>
  <rect width="108" height="108" fill="url(#bg)"/>
  <rect width="108" height="108" fill="url(#glow)"/>
  <rect width="108" height="108" fill="url(#glow2)"/>
  <!-- straight arrow behind the phone -->
  <path d="M22 56 L80 56" fill="none" stroke="url(#hop)" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M87 56 L79.5 51 L79.5 61 Z" fill="#D5D9DF" stroke="#D5D9DF" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- phone -->
  <rect x="38" y="30" width="32" height="52" rx="7.5" fill="url(#phone)" stroke="#FFFFFF" stroke-opacity="0.92" stroke-width="2.4"/>
  <rect x="48.5" y="77" width="11" height="2.2" rx="1.1" fill="#FFFFFF" fill-opacity="0.8"/>
  <!-- wifi glyph -->
  <g fill="none" stroke="url(#wifi)" stroke-width="3" stroke-linecap="round">
    <path d="M49.76 63.76 A6 6 0 0 1 58.24 63.76"/>
    <path d="M45.87 59.87 A11.5 11.5 0 0 1 62.13 59.87"/>
    <path d="M41.98 55.98 A17 17 0 0 1 66.02 55.98"/>
  </g>
  <circle cx="54" cy="68.5" r="2.8" fill="#D5D9DF"/>
</svg>
